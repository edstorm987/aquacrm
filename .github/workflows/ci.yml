name: aquacrm-ci

# The required pull-request / main verification pipeline (#188).
#
# Before this existed the only checked-in workflow was `db-backup.yml`; a clean
# developer machine was the release coordinator. This makes the release gate
# reproducible and machine-enforced. Every step runs against EXPLICIT isolated
# in-repo storage (memory for tests, an isolated file backend for the build and
# browser lane) — CI has no `.env.local` and is additionally pinned here, so no
# job can reach or mutate a live Supabase/Postgres backend or any provider.
#
# ── Mandatory checks (branch protection on `main` should require these) ────────
#   verify   — clean install · typecheck · canonical suite · production build ·
#              production dependency audit.
#   browser  — bounded axe/responsive accessibility gate on a provider-free lane.
# A release/deploy MUST depend on both jobs being green, not on an undocumented
# local sequence.
#
# ── Deliberately NOT in CI (separate, credentialed lanes) ──────────────────────
#   * The two optional live-Postgres test lanes stay SKIPPED here — visible as
#     NOT TESTED in the suite output, never counted as green (they need a real
#     `DATABASE_URL`).
#   * Live-provider acceptance (real Stripe settlement/webhooks, Meta, production
#     email, apex TLS) and the full production-exact 13×17 browser matrix with a
#     seeded session are owner-run lanes with real accounts — never in this
#     secretless workflow. See docs/development/tests.md § CI.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

# Least privilege: read the code, nothing else.
permissions:
  contents: read

# One in-flight run per ref; a new push cancels the previous run.
concurrency:
  group: aquacrm-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Current Node LTS, matching local. (Also removes any dependence on a specific
  # Node's --test glob behaviour: discovery is done by scripts/run-canonical-suite.mjs
  # in Node, not by the shell or the runner's glob support.)
  NODE_VERSION: "22"
  # Belt-and-braces isolation. CI never checks out `.env.local`, but pinning the
  # backend here means no step can implicitly promote to a live backend even if a
  # secret were ever added to the environment.
  PORTAL_BACKEND: memory

jobs:
  verify:
    name: Typecheck · Canonical suite · Build · Audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Clean install from lockfile
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Canonical test suite (isolated memory storage; Website Editor included)
        # `smoke:all` runs scripts/run-canonical-suite.mjs — a deterministic,
        # shell-independent enumerator that FAILS the run if zero expected test
        # files are discovered (no silent short-green) — then the separate
        # Website Editor gate via `&& npm run smoke:website-editor`. The two
        # live-Postgres lanes remain SKIPPED (NOT TESTED), printed in the output;
        # runtime RLS is proven by the separate `containment` job below, not here.
        run: npm run smoke:all

      - name: Production build (isolated file storage)
        env:
          PORTAL_BACKEND: file
          PORTAL_DATA_FILE: .data/ci-build-state.json
          NEXT_DIST_DIR: .next-ci
        run: npm run build

      - name: Production dependency audit (moderate and above)
        run: npm audit --omit=dev --audit-level=moderate

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verify-failure-${{ github.run_id }}
          path: |
            portal/.next-ci/build-manifest.json
            portal/.next-ci/*.log
          if-no-files-found: ignore
          retention-days: 14

  containment:
    name: Runtime DB/storage containment (real Supabase, Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Runtime RLS/grants/storage isolation cannot be proven by static tests. This
    # job boots a REAL local Supabase stack (Postgres + PostgREST + Storage) in
    # Docker, applies the full migration chain (including the assume-breach
    # containment migration and its self-verification DO block), and runs the
    # two-tenant negative/positive suite with real password-grant JWTs. It is a
    # required release gate — branch protection on `main` should require it
    # alongside `verify` and `browser`. It reads no DATABASE_URL and cannot reach
    # any remote project (LOCAL ONLY, enforced by the runner script).
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install Supabase CLI
        uses: supabase/setup-cli@6333c3ad342ec99344de1621ff61bef932a81b45 # v1.2.0
        with:
          version: 2.111.0

      - name: Start local Supabase stack (Docker)
        run: supabase start

      - name: Containment isolation suite (two tenants, real JWTs, PostgREST + Storage)
        run: bash supabase/tests/run-containment-tests.sh

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup || true

  client-portal:
    name: Client portal · typecheck · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The sibling standalone client portal ships independently and shares the
    # ecosystem's enquiry surface (Item 5). It must typecheck and build in CI so
    # a change here (e.g. the server-mediated enquiry migration) cannot silently
    # break it. Its tracked lockfile is authoritative, so installs are
    # reproducible and fail when package metadata drifts.
    defaults:
      run:
        working-directory: client-portal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Clean install from lockfile
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build

  browser:
    name: Bounded browser / accessibility gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Clean install from lockfile
        run: npm ci

      - name: Install Chromium for Playwright
        run: npm run browser:install

      - name: Start isolated dev server (file backend, dev-mode auth, no providers)
        # `dev:sandbox` is provider-free: file backend, its own build dir and port
        # 3032, and PORTAL_DEV_MODE=true so the matrix signs in through `/dev`
        # (a real writable session minted with NO credentials). Nothing here can
        # reach Supabase or any external provider.
        env:
          PORTAL_DATA_FILE: .data/ci-browser-state.json
        run: |
          nohup npm run dev:sandbox > /tmp/dev-sandbox.log 2>&1 &
          for i in $(seq 1 150); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3032/healthz 2>/dev/null || echo 000)
            if [ "$code" = "200" ]; then echo "dev server ready after ${i}s"; exit 0; fi
            sleep 2
          done
          echo "dev server did not become ready"; tail -40 /tmp/dev-sandbox.log; exit 1

      - name: Bounded axe / responsive matrix (stable pages, provider-free)
        # Bounded on purpose: the stable public + agency surfaces across three
        # representative viewports. `axeVerdict(null)` and a MISSING check both
        # FAIL the run (the runner's honesty contract), so a browser-less or
        # half-scanned run is red, never a short green.
        env:
          AQUA_BASE: http://localhost:3032
          AQUA_PAGES: /portal/agency,/login,/
          AQUA_VIEWPORTS: mobile-portrait,tablet-portrait,desktop
        run: npm run browser:matrix

      - name: Upload browser matrix records on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-matrix-${{ github.run_id }}
          path: |
            portal/.artefacts/browser-matrix/records.json
            /tmp/dev-sandbox.log
          if-no-files-found: ignore
          retention-days: 14
